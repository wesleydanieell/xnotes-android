name: PR 431 signed release APK

on:
  push:
    branches: [ci/pr-431-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android native build dependencies
        run: sdkmanager --install 'platforms;android-36' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create temporary test signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt -keystore app/pr431-test.jks -alias pr431test -keyalg RSA -keysize 3072 -validity 365 -dname "CN=XNotes PR431 Test" -storepass testonly431 -keypass testonly431
          printf '%s\\n' 'storeFile=pr431-test.jks' 'storePassword=testonly431' 'keyAlias=pr431test' 'keyPassword=testonly431' > keystore.properties
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/XNotes-PR431-test-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: xnotes-pr-431-signed-release
          path: dist/
          if-no-files-found: error
